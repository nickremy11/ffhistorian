name: Deploy FF Historian

on:
  push:
    branches: [main]

jobs:
  # ── Deploy the ffhistorian.com landing page (home/) to Pages ──
  # The record book itself (pages/) ships with the Worker below as its static
  # assets, on recordbook.ffhistorian.com.
  deploy-pages:
    name: Deploy Cloudflare Pages (landing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ffhistorian
          directory: home
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ── Deploy the Worker: record book pages + API (recordbook.ffhistorian.com) ──
  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
