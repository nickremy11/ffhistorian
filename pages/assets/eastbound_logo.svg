<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Eastbound FFL">
  <defs>
    <linearGradient id="eb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b84b"/>
      <stop offset="1" stop-color="#c9962a"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#2d4a1e" stroke="url(#eb-gold)" stroke-width="4"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="#c9962a" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.65"/>
  <!-- compass star, elongated toward East -->
  <polygon points="50,16 56,44 84,50 56,56 50,84 44,56 16,50 44,44"
           fill="url(#eb-gold)" stroke="#2a1a0e" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- east point highlight -->
  <polygon points="84,50 56,44 56,56" fill="#f5ead6" stroke="#2a1a0e" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="50" cy="50" r="4.5" fill="#f5ead6" stroke="#2a1a0e" stroke-width="1.5"/>
</svg>
