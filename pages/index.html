<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Record Book — FF Historian</title>
<!-- One look for every FF Historian site: League Assist's shared stylesheet. -->
<link rel="stylesheet" href="https://helper.ffhistorian.com/shared-styles.css?v=20261122" />
<script>try{if(/(?:^|; )sh_theme=dark/.test(document.cookie)||localStorage.getItem("sh_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<style>
.main { max-width: var(--page-max); margin: 0 auto; padding: 28px 32px 80px; }
.banner-back { font-family: var(--font-display), serif; font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--gold-light); text-decoration: none; opacity: 0.8; display: inline-block; margin-bottom: 6px; }
.banner-back:hover { opacity: 1; }

/* toolbar: search + view toggle */
.rb-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.rb-tools .search-input { flex: 1 1 260px; min-width: 0; padding: 11px 14px; font: inherit; font-size: 1rem; }
.rb-view { display: flex; gap: 6px; }
.rb-view button { font-family: var(--font-display), serif; font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; padding: 10px 14px; cursor: pointer; }
.rb-count { font-style: italic; color: var(--brown-light); font-size: 0.9rem; margin: 4px 0 18px; min-height: 1.2em; }

.rb-label { font-family: var(--font-display), serif; font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--label); margin: 30px 0 12px; display: flex; align-items: center; gap: 12px; }
.rb-label::after { content: ''; flex: 1; height: 2px; background: var(--rule); }
.rb-label .n { color: var(--brown-light); letter-spacing: 0.1em; }

/* grid view */
.rb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 2px solid var(--edge); border-radius: 10px; }
a.rb-card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-decoration: none; color: var(--cream);
  transition: transform 0.12s, box-shadow 0.12s; }
a.rb-card:hover { transform: translateY(-2px); box-shadow: 4px 6px 0 rgba(var(--tint),0.18); }
.rb-logo { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--edge); background: var(--card-hover);
  display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 1.5rem; }
.rb-logo img { width: 100%; height: 100%; object-fit: cover; }
.rb-body { min-width: 0; flex: 1; }
.rb-name { font-family: var(--font-head), serif; font-weight: 700; font-size: 1.02rem; line-height: 1.2; overflow-wrap: anywhere; }
.rb-meta { font-size: 0.78rem; color: var(--brown-light); margin-top: 3px; }
.rb-tag { display: inline-block; font-family: var(--font-display), serif; font-size: 0.56rem; letter-spacing: 0.12em; text-transform: uppercase;
  border: 1px solid var(--edge); border-radius: 4px; padding: 1px 5px; margin-right: 4px; vertical-align: 1px; }
.rb-arrow { color: var(--gold); font-size: 1.1rem; }

/* list view */
.rb-table { width: 100%; border-collapse: collapse; background: var(--card); border: 2px solid var(--edge); }
.rb-table th { background: var(--ink-bg); color: var(--ink-fg); font-family: var(--font-display), serif; font-size: 0.6rem;
  letter-spacing: 0.14em; text-transform: uppercase; text-align: left; padding: 10px 12px; }
.rb-table td { padding: 9px 12px; border-bottom: 1px solid var(--rule); color: var(--card-text); font-size: 0.92rem; }
.rb-table tr:last-child td { border-bottom: none; }
.rb-table tbody tr { cursor: pointer; }
.rb-table tbody tr:hover td { background: var(--card-hover); }
.rb-table a { color: var(--card-text); font-weight: 700; text-decoration: none; }
@media (max-width: 640px) { .rb-table .rb-hide-sm { display: none; } }

.rb-empty { font-style: italic; color: var(--brown-light); padding: 8px 0; }
.rb-note { font-style: italic; color: var(--brown-light); margin: 6px 0; }
.rb-note a { color: var(--gold); }

/* open any league by id */
.rb-finder { padding: 16px 18px; margin-top: 30px; }
.rb-finder p { margin-bottom: 10px; color: var(--parchment); }
.rb-finder p a { color: var(--gold); }
.rb-finder-row { display: flex; gap: 10px; }
.rb-finder-row input { flex: 1; min-width: 0; padding: 10px 12px; font: inherit; }
.rb-finder-msg { min-height: 1.2em; margin-top: 6px; color: var(--c-red); font-style: italic; font-size: 0.9rem; }
footer { padding: 24px; }
</style>
</head>
<body>
<div class="page-wrap">
  <header class="banner">
    <div class="banner-inner">
      <div class="banner-text">
        <a class="banner-back" href="https://ffhistorian.com">← FF Historian</a>
        <h1>The Record <span>Book</span></h1>
        <div class="banner-sub">Standings, rivalries, trades and records for every league</div>
        <div class="banner-divider"></div>
      </div>
      <div id="auth-chip" style="flex-shrink:0;"></div>
    </div>
  </header>

  <main class="main">
    <div class="rb-tools">
      <input id="rbSearch" class="search-input" type="search" placeholder="Search leagues…" autocomplete="off" aria-label="Search leagues"/>
      <div class="rb-view" role="group" aria-label="View">
        <button class="pos-pill" data-view="grid" onclick="setView('grid')">▦ Grid</button>
        <button class="pos-pill" data-view="list" onclick="setView('list')">☰ List</button>
      </div>
    </div>
    <div class="rb-count" id="rbCount"></div>

    <div id="rbArchive"></div>
    <div id="rbMine"></div>

    <div class="card rb-finder">
      <p id="finderHint">Open any Sleeper league's history book: paste its league ID or sleeper.com link.</p>
      <div class="rb-finder-row">
        <input id="finderInput" class="search-input" placeholder="e.g. 1180232430068178944 or sleeper.com/leagues/…" autocomplete="off"/>
        <button class="setup-btn" style="padding:0 18px;font-family:var(--font-display),serif;font-size:0.62rem;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer" onclick="openLeagueFromInput()">Open</button>
      </div>
      <div class="rb-finder-msg" id="finderMsg"></div>
    </div>
  </main>

  <footer>
    <p><a href="https://ffhistorian.com">FF Historian</a> · Built on <a href="https://sleeper.com">Sleeper</a> &amp; <a href="https://fantasy.espn.com">ESPN</a> data</p>
  </footer>
</div>

<script src="https://helper.ffhistorian.com/shared-auth.js"></script>
<script src="/league/leagues.js"></script>
<script>
// ════════════════════════════════════════════════════════════════════════════
// The Record Book landing (recordbook.ffhistorian.com).
//   Archive leagues  — the curated LEAGUES list (league/leagues.js)
//   Your leagues     — signed in: your current Sleeper leagues (/api/history/mine),
//                      each opening at /l/{id} (worker/src/history.js)
// One search box filters both as you type; Grid/List is remembered per browser.
// ════════════════════════════════════════════════════════════════════════════
const escH = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } };

const RB = {
  view: lsGet("rb_view") === "list" ? "list" : "grid",
  q: "",
  mine: null,          // null = not loaded / signed out; [] = none
  mineMsg: "",
};

// A curated league opens on its own page, whichever season's id was given
function leagueHref(id) {
  const c = LEAGUES.find(l => Object.values(l.seasons || {}).map(String).includes(String(id)));
  return c ? `/${c.slug}/` : `/l/${id}`;
}

// One row shape for both lists, so the grid, the table and the search don't branch
function archiveRows() {
  return LEAGUES.map(l => {
    const yrs = Object.keys(l.seasons || {}).sort();
    return {
      href: `/${l.slug}/`, name: l.cardName || l.name, logo: l.logo, emoji: l.emoji || "🏈",
      platform: l.platform === "espn" ? "ESPN" : "Sleeper",
      format: l.format === "redraft" ? "Redraft" : "Dynasty",
      seasons: yrs.length ? (yrs.length > 1 ? `${yrs[0]}–${yrs.at(-1)}` : yrs[0]) : "",
      extra: "",
    };
  });
}
function mineRows() {
  // A curated league already sits in the archive list — don't show it twice
  const curated = new Set(LEAGUES.flatMap(l => Object.values(l.seasons || {}).map(String)));
  return (RB.mine || []).filter(l => !curated.has(String(l.league_id))).map(l => ({
    href: leagueHref(l.league_id), name: l.name,
    logo: l.avatar ? `https://sleepercdn.com/avatars/thumbs/${l.avatar}` : "", emoji: "🏈",
    platform: "Sleeper",
    format: (l.dynasty ? "Dynasty" : "Redraft") + (l.best_ball ? " · Best Ball" : ""),
    seasons: String(l.season), extra: `${l.teams} teams`,
  }));
}

const matches = (r, q) => !q || `${r.name} ${r.platform} ${r.format} ${r.seasons}`.toLowerCase().includes(q);

function logoHtml(r) {
  return r.logo
    ? `<span class="rb-logo"><img src="${escH(r.logo)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${r.emoji}'))"/></span>`
    : `<span class="rb-logo">${escH(r.emoji)}</span>`;
}

function listHtml(rows) {
  if (RB.view === "list") {
    return `<table class="rb-table"><thead><tr><th>League</th><th>Platform</th><th class="rb-hide-sm">Format</th><th>Seasons</th></tr></thead><tbody>${
      rows.map(r => `<tr onclick="location.href='${escH(r.href)}'">
        <td><a href="${escH(r.href)}">${escH(r.name)}</a></td>
        <td>${escH(r.platform)}</td>
        <td class="rb-hide-sm">${escH(r.format)}${r.extra ? ` · ${escH(r.extra)}` : ""}</td>
        <td>${escH(r.seasons)}</td></tr>`).join("")
    }</tbody></table>`;
  }
  return `<div class="rb-grid">${rows.map(r => `
    <a class="card rb-card" href="${escH(r.href)}">
      ${logoHtml(r)}
      <span class="rb-body">
        <span class="rb-name">${escH(r.name)}</span>
        <span class="rb-meta" style="display:block"><span class="rb-tag">${escH(r.platform)}</span>${escH(r.format)}${r.seasons ? ` · ${escH(r.seasons)}` : ""}${r.extra ? ` · ${escH(r.extra)}` : ""}</span>
      </span>
      <span class="rb-arrow">→</span>
    </a>`).join("")}</div>`;
}

function section(title, all, q) {
  const rows = all.filter(r => matches(r, q));
  const n = q ? `${rows.length} of ${all.length}` : `${all.length}`;
  return { rows, html: `<div class="rb-label">${escH(title)} <span class="n">${n}</span></div>`
    + (rows.length ? listHtml(rows) : `<p class="rb-empty">No ${escH(title.toLowerCase())} match “${escH(RB.q)}”.</p>`) };
}

function draw() {
  const q = RB.q.trim().toLowerCase();
  document.querySelectorAll(".rb-view button").forEach(b => b.classList.toggle("active", b.dataset.view === RB.view));

  const a = section("Archive leagues", archiveRows(), q);
  document.getElementById("rbArchive").innerHTML = a.html;

  let shown = a.rows.length, total = LEAGUES.length;
  const mineEl = document.getElementById("rbMine");
  if (RB.mine === null) {
    mineEl.innerHTML = RB.mineMsg ? `<div class="rb-label">Your Sleeper leagues</div><p class="rb-note">${RB.mineMsg}</p>` : "";
  } else {
    const all = mineRows();
    const m = section("Your Sleeper leagues", all, q);
    mineEl.innerHTML = all.length ? m.html : `<div class="rb-label">Your Sleeper leagues</div><p class="rb-note">${RB.mineMsg || "No other Sleeper leagues this season."}</p>`;
    shown += m.rows.length; total += all.length;
  }
  document.getElementById("rbCount").textContent = q ? `${shown} of ${total} leagues match` : "";
}

function setView(v) { RB.view = v; lsSet("rb_view", v); draw(); }

document.getElementById("rbSearch").addEventListener("input", e => { RB.q = e.target.value; draw(); });

function openLeagueFromInput() {
  const m = document.getElementById("finderInput").value.trim().match(/\d{6,25}/);
  if (!m) { document.getElementById("finderMsg").textContent = "That doesn't look like a Sleeper league ID."; return; }
  // Signed out still goes: an already-opened league works for anyone, and the
  // league page asks for sign-in if this one is new.
  location.href = leagueHref(m[0]);
}
document.getElementById("finderInput").addEventListener("keydown", e => { if (e.key === "Enter") openLeagueFromInput(); });

async function loadMine() {
  RB.mine = null; RB.mineMsg = "Reading your leagues from Sleeper…"; draw();
  try {
    const r = await fetch("/api/history/mine", { credentials: "include" });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    if (d.noUsername || d.badUsername) {
      RB.mine = [];
      RB.mineMsg = `${d.badUsername ? `Sleeper doesn't know the username “${escH(d.badUsername)}”.` : "No Sleeper username on your account."}
        Add it on <a href="https://helper.ffhistorian.com/myprofile">your profile</a> to list your leagues here.`;
    } else {
      RB.mine = d.leagues.sort((a, b) => a.name.localeCompare(b.name));
      RB.mineMsg = "";
    }
  } catch (e) {
    RB.mine = null; RB.mineMsg = `Couldn't load your leagues (${escH(e.message)}).`;
  }
  draw();
}

(async function init() {
  draw();
  const hint = document.getElementById("finderHint");
  const onIn = () => { loadMine(); };
  const onOut = () => {
    RB.mine = null;
    RB.mineMsg = `<a href="#" onclick="SharedAuth.openModal();return false;">Sign in</a> to list your own Sleeper leagues here.`;
    hint.innerHTML = `Open any Sleeper league's history book: paste its league ID or sleeper.com link. Opening a league for the first time needs an account; after that, its link works for anyone.`;
    draw();
  };
  if (!window.SharedAuth) return onOut();
  const user = await SharedAuth.init({ chipContainerId: "auth-chip", onLogin: onIn, onLogout: onOut });
  user ? onIn() : onOut();
})();
</script>
</body>
</html>
