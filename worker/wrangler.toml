name = "ffhistorian-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

# The record book: this Worker serves the static pages (../pages, incl. _redirects)
# AND the API, on its own host. Requests that match a file are served straight from
# the assets; everything else (/api/*) runs the Worker.
# ffhistorian.com/api/* stays routed here too, for anything still calling the old host.
routes = [
  { pattern = "recordbook.ffhistorian.com", custom_domain = true },
  { pattern = "ffhistorian.com/api/*", zone_name = "ffhistorian.com" },
]

[assets]
directory = "../pages"
html_handling = "auto-trailing-slash"

[[kv_namespaces]]
binding = "FF_CACHE"
id = "c8fa6169e99b4202a9aa6441e0a39aba"

[[r2_buckets]]
bucket_name = "ff-historian-espn"
binding = "ESPN_DATA"
# Shared with sleeper-helper: read-only session lookup for /api/history/* (history.js).
# Sign-in itself happens on helper.ffhistorian.com; the sh_session cookie is .ffhistorian.com.
[[d1_databases]]
binding       = "DB"
database_name = "sleeper-helper-db"
database_id   = "7b094e00-d010-43a8-8f1a-047e72901cd8"

# Helper's private EspnCookies entrypoint (sleeper-helper/worker/src/espn-cookies.js):
# the opener's ESPN cookies for a generic /l/espn_{id} league (espn-auth.js).
# Not a public route — deploy helper FIRST, or this binding has nothing to call.
[[services]]
binding    = "HELPER"
service    = "sleeper-helper-worker"
entrypoint = "EspnCookies"

# Helper's private PlatformLeagues entrypoint (sleeper-helper/worker/src/platform-leagues.js):
# every read of an MFL / Yahoo league at /l/mfl_{id} or /l/yh_{id} (platform.js), made
# with the opener's MFL cookie / Yahoo token. Deploy helper FIRST, as for EspnCookies.
[[services]]
binding    = "PLATFORMS"
service    = "sleeper-helper-worker"
entrypoint = "PlatformLeagues"

# Daily FantasyCalc snapshot → R2 fc-snapshots/YYYY-MM-DD.json (day-of trade values).
[triggers]
crons = ["15 11 * * *"]
